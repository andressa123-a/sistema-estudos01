<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cronograma de Estudos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0f19; 
            color: #e2e8f0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding: 24px 12px;
        }
        .header-title {
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-column {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 18px;
            min-height: 75vh;
        }
        .item-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }
        .badge-fase { font-size: 0.68rem; font-weight: 600; padding: 3px 7px; border-radius: 6px; }
        .fase-1 { background-color: #ef4444; color: white; }
        .fase-2 { background-color: #f59e0b; color: white; }
        .fase-3 { background-color: #3b82f6; color: white; }
        .fase-diario { background-color: #10b981; color: white; }
        
        .btn-filter {
            border-radius: 20px;
            font-size: 0.82rem;
            padding: 5px 12px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #94a3b8;
            margin: 2px;
        }
        .btn-filter.active, .btn-filter:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: 600;
        }
        .btn-action {
            font-size: 0.72rem;
            border-radius: 6px;
            padding: 3px 7px;
        }
    </style>
</head>
<body>
    <div class="container-fluid max-w-7xl mx-auto">
        
        <!-- Cabeçalho Minimalista -->
        <div class="text-center mb-4">
            <h2 class="header-title display-6">✨ Central de Estudos</h2>
            <p class="text-secondary small mb-0">Checklist e cronograma interativo</p>
        </div>

        <!-- Filtros por Matéria -->
        <div class="text-center mb-4">
            <button class="btn btn-filter active" onclick="filtrar('Todas', event)">🌟 Todas</button>
            <button class="btn btn-filter" onclick="filtrar('Português', event)">🟣 Português</button>
            <button class="btn btn-filter" onclick="filtrar('Matemática', event)">🔵 Matemática</button>
            <button class="btn btn-filter" onclick="filtrar('História', event)">📜 História</button>
            <button class="btn btn-filter" onclick="filtrar('Geografia', event)">🌎 Geografia</button>
            <button class="btn btn-filter" onclick="filtrar('Biologia', event)">🧬 Biologia</button>
            <button class="btn btn-filter" onclick="filtrar('Química', event)">⚗️ Química</button>
            <button class="btn btn-filter" onclick="filtrar('Física', event)">⚡ Física</button>
            <button class="btn btn-filter" onclick="filtrar('Atualidades', event)">📰 Atualidades</button>
            <button class="btn btn-filter" onclick="filtrar('Redação', event)">🔴 Redação</button>
        </div>

        <!-- Colunas Kanban -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card-column">
                    <h6 class="text-warning fw-bold mb-3">📥 A Estudar</h6>
                    <div id="coluna-a-estudar"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-column">
                    <h6 class="text-info fw-bold mb-3">⏳ Em Andamento</h6>
                    <div id="coluna-em-andamento"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-column">
                    <h6 class="text-success fw-bold mb-3">✅ Concluído</h6>
                    <div id="coluna-concluido"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lista = [];
        let filtroMateria = 'Todas';

        function carregar() {
            fetch('/api/topicos')
                .then(r => r.json())
                .then(data => {
                    lista = data;
                    render();
                })
                .catch(e => console.error(e));
        }

        function render() {
            const colA = document.getElementById('coluna-a-estudar');
            const colE = document.getElementById('coluna-em-andamento');
            const colC = document.getElementById('coluna-concluido');

            colA.innerHTML = ''; colE.innerHTML = ''; colC.innerHTML = '';

            const filtrados = (filtroMateria === 'Todas') 
                ? lista 
                : lista.filter(x => x.materia === filtroMateria);

            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let fClass = 'fase-3';
                if (item.fase === 'Fase 1') fClass = 'fase-1';
                if (item.fase === 'Fase 2') fClass = 'fase-2';
                if (item.fase === 'Diário') fClass = 'fase-diario';

                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="badge badge-fase ${fClass}">${item.fase}</span>
                        <small style="font-size:0.7rem; color:#f59e0b;">${item.prioridade}</small>
                    </div>
                    <div class="fw-bold text-info small mb-1">${item.materia}</div>
                    <div class="text-slate-200 small mb-2">${item.nome}</div>
                    <div class="d-flex justify-content-end gap-1">
                        ${item.status !== 'A Estudar' ? `<button onclick="mover(${item.id}, 'A Estudar')" class="btn btn-outline-warning btn-action">⬅ Parar</button>` : ''}
                        ${item.status !== 'Em Andamento' ? `<button onclick="mover(${item.id}, 'Em Andamento')" class="btn btn-outline-info btn-action">⏳ Estudar</button>` : ''}
                        ${item.status !== 'Concluído' ? `<button onclick="mover(${item.id}, 'Concluído')" class="btn btn-outline-success btn-action">✔ Feito</button>` : ''}
                    </div>
                `;

                if (item.status === 'A Estudar') colA.appendChild(card);
                else if (item.status === 'Em Andamento') colE.appendChild(card);
                else if (item.status === 'Concluído') colC.appendChild(card);
            });
        }

        function mover(id, novoStatus) {
            fetch('/api/topicos/atualizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, status: novoStatus })
            }).then(() => {
                const item = lista.find(x => x.id === id);
                if (item) item.status = novoStatus;
                render();
            });
        }

        function filtrar(mat, evt) {
            filtroMateria = mat;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
            render();
        }

        carregar();
    </script>
</body>
</html>
