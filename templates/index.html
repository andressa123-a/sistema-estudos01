<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-border: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 32px 16px;
            min-height: 100vh;
        }

        .header-section {
            margin-bottom: 32px;
        }

        .header-title {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filter-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 36px;
        }

        .btn-filter {
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 6px 14px;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .btn-filter:hover, .btn-filter.active {
            background-color: #21262d;
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 2px 8px rgba(88, 166, 255, 0.15);
        }

        .kanban-column {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            min-height: 75vh;
        }

        .column-header {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-card {
            background-color: #0d1117;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .item-card:hover {
            border-color: #8b949e;
            transform: translateY(-2px);
        }

        .badge-fase {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fase-1 { background-color: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); }
        .fase-2 { background-color: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); }
        .fase-3 { background-color: rgba(88, 166, 255, 0.15); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.4); }
        .fase-diario { background-color: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.4); }

        .materia-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nome-topico {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            margin: 6px 0 12px 0;
            line-height: 1.4;
        }

        .btn-action {
            font-size: 0.7rem;
            font-weight: 500;
            border-radius: 8px;
            padding: 4px 10px;
            border: 1px solid var(--card-border);
            background-color: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background-color: var(--card-border);
            color: var(--text-main);
        }

        .btn-action-check:hover {
            border-color: #238636;
            color: #3fb950;
        }
    </style>
</head>
<body>
    <div class="container-fluid max-w-7xl mx-auto">
        
        <!-- Topo -->
        <div class="text-center header-section">
            <h1 class="header-title">✨ Central de Estudos</h1>
            <p class="text-secondary small mb-0">Organização simples, focada e minimalista</p>
        </div>

        <!-- Filtros por Matéria -->
        <div class="filter-container">
            <button class="btn btn-filter active" onclick="filtrar('Todas', event)">🌟 Todas</button>
            <button class="btn btn-filter" onclick="filtrar('Português', event)">🟣 Português</button>
            <button class="btn btn-filter" onclick="filtrar('Matemática', event)">🔵 Matemática</button>
            <button class="btn btn-filter" onclick="filtrar('História', event)">📜 História</button>
            <button class="btn btn-filter" onclick="filtrar('Geografia', event)">🌎 Geografia</button>
            <button class="btn btn-filter" onclick="filtrar('Biologia', event)">🧬 Biologia</button>
            <button class="btn btn-filter" onclick="filtrar('Química', event)">⚗️ Química</button>
            <button class="btn btn-filter" onclick="filtrar('Física', event)">⚡ Física</button>
            <button class="btn btn-filter" onclick="filtrar('Atualidades', event)">📰 Atualidades</button>
            <button class="btn btn-filter" onclick="filtrar('Redação', event)">🔴 Redação</button>
        </div>

        <!-- Quadro Kanban Minimalista -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="kanban-column">
                    <div class="column-header text-warning">
                        <span>📥</span> A Estudar
                    </div>
                    <div id="coluna-a-estudar"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kanban-column">
                    <div class="column-header text-info">
                        <span>⏳</span> Em Andamento
                    </div>
                    <div id="coluna-em-andamento"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kanban-column">
                    <div class="column-header text-success">
                        <span>✅</span> Concluído
                    </div>
                    <div id="coluna-concluido"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lista = [];
        let filtroMateria = 'Todas';

        function carregar() {
            fetch('/api/topicos')
                .then(r => r.json())
                .then(data => {
                    lista = data;
                    render();
                })
                .catch(e => console.error(e));
        }

        function render() {
            const colA = document.getElementById('coluna-a-estudar');
            const colE = document.getElementById('coluna-em-andamento');
            const colC = document.getElementById('coluna-concluido');

            colA.innerHTML = ''; colE.innerHTML = ''; colC.innerHTML = '';

            const filtrados = (filtroMateria === 'Todas') 
                ? lista 
                : lista.filter(x => x.materia === filtroMateria);

            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                let fClass = 'fase-3';
                if (item.fase === 'Fase 1') fClass = 'fase-1';
                if (item.fase === 'Fase 2') fClass = 'fase-2';
                if (item.fase === 'Diário') fClass = 'fase-diario';

                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge badge-fase ${fClass}">${item.fase}</span>
                        <small style="font-size:0.7rem; color:#d29922;">${item.prioridade}</small>
                    </div>
                    <div class="materia-title mt-2">${item.materia}</div>
                    <div class="nome-topico">${item.nome}</div>
                    <div class="d-flex justify-content-end gap-1">
                        ${item.status !== 'A Estudar' ? `<button onclick="mover(${item.id}, 'A Estudar')" class="btn btn-action">⬅ Voltar</button>` : ''}
                        ${item.status !== 'Em Andamento' ? `<button onclick="mover(${item.id}, 'Em Andamento')" class="btn btn-action">⏳ Estudar</button>` : ''}
                        ${item.status !== 'Concluído' ? `<button onclick="mover(${item.id}, 'Concluído')" class="btn btn-action btn-action-check">✔ Feito</button>` : ''}
                    </div>
                `;

                if (item.status === 'A Estudar') colA.appendChild(card);
                else if (item.status === 'Em Andamento') colE.appendChild(card);
                else if (item.status === 'Concluído') colC.appendChild(card);
            });
        }

        function mover(id, novoStatus) {
            fetch('/api/topicos/atualizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, status: novoStatus })
            }).then(() => {
                const item = lista.find(x => x.id === id);
                if (item) item.status = novoStatus;
                render();
            });
        }

        function filtrar(mat, evt) {
            filtroMateria = mat;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
            render();
        }

        carregar();
    </script>
</body>
</html>
